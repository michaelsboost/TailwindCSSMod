<!DOCTYPE html>
<html lang="en">
  <head>
    <title>TailwindCSSMod</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"              content="width=device-width, initial-scale=1">
    <meta name="description"           content="Minor modification made to Tailwind css v2.2.19 to be used with any css library of your choice like Pico.css">
    <meta property="og:url"            content="https://michaelsboost.com/TailwindCSSMod/">
    <meta property="og:type"           content="website">
    <meta property="og:title"          content="TailwindCSSMod">
    <meta property="og:description"    content="Minor modification made to Tailwind css v2.2.19 to be used with any css library of your choice like Pico.css">
    <link rel="stylesheet"    href="https://cdnjs.cloudflare.com/ajax/libs/picocss/1.5.7/pico.classless.min.css">
    <link rel="stylesheet"    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <link rel="stylesheet"    href="tailwind-mod.min.css">
  </head>
  <body>
    <div id="container" class="absolute inset-0 grid place-items-center"></div>

    <script src="tailwind-mod.min.js"></script>
    <script>
      // easy way to render an element to reduce code
      function elm(htmlOrOptions, container) {
        let html, events, func;
        
        if (typeof htmlOrOptions === 'object') {
          html = htmlOrOptions.html;
          events = htmlOrOptions.events;
          func = htmlOrOptions.func;
          container = htmlOrOptions.container;
        } else {
          html = htmlOrOptions;
        }
        
        const elm = document.createElement("div");
        elm.innerHTML = html;
        const element = elm.firstElementChild;
        
        if (events && func) {
          events.split(' ').forEach(event => {
            element.addEventListener(event, func);
          });
        }
        
        return container.appendChild(element);
      }
      
      elm(`
      <div class="p-8 shadow-2xl shadow-blue-500 rounded-lg">
        <h1 class="mt-0 mb-4 text-white">
          Pico CSS + Tailwind CSS
        </h1>
        <hr>

        <div class="mt-4 flex justify-between">
          <a href="https://michaelsboost.com/TailwindCSSMod/tailwind-mod.min.css" role="button" download class="bg-transparent rounded-full border border-white capitalize text-lg p-x-4">
            download <i class="ml-1 fa-solid fa-download"></i>
          </a>

          <a href="https://github.com/michaelsboost/TailwindCSSMod/" target="_blank" role="button" class="bg-transparent rounded-full border border-white capitalize text-lg p-x-4">
            view <i class="ml-1 fa-brands fa-github"></i>
          </a>
        </div>
      </div>`, container);
    </script>
  </body>
</html>
